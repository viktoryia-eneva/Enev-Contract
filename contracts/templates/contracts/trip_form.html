{% extends "contracts/base.html" %}
{% load i18n %}

{% block content %}
<h1>{% if trip %}{% translate "Edit trip" %}{% else %}{% translate "New trip" %}{% endif %}</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_div }}
  <div class="actions">
    <button type="submit">{% translate "Save" %}</button>
    <a href="{% url 'contracts:trip_list' %}" role="button" class="secondary outline">{% translate "Back" %}</a>
  </div>
</form>
{% endblock %}
