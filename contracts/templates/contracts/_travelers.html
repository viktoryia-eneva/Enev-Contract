{% load i18n %}
<h3>{% translate "Travelers" %}</h3>
{{ formset.management_form }}

<div id="travelers">
  {% for f in formset %}
    <div class="grid">
      <div>{{ f.full_name.label_tag }} {{ f.full_name }} {{ f.full_name.errors }}</div>
      <div>{{ f.egn.label_tag }} {{ f.egn }} {{ f.egn.errors }}</div>
    </div>
  {% endfor %}
</div>

{# Hidden blueprint of one empty row; JavaScript copies it #}
<template id="traveler-template">
  <div class="grid">
    <div>{{ formset.empty_form.full_name.label_tag }} {{ formset.empty_form.full_name }}</div>
    <div>{{ formset.empty_form.egn.label_tag }} {{ formset.empty_form.egn }}</div>
  </div>
</template>

<button type="button" id="add-traveler" class="secondary outline" style="width:auto; margin-bottom:1.5rem">
  + {% translate "Add traveler" %}
</button>

<script>
  document.getElementById("add-traveler").addEventListener("click", function () {
    const total = document.getElementById("id_travelers-TOTAL_FORMS");
    const index = Number(total.value);
    const html = document.getElementById("traveler-template").innerHTML.replaceAll("__prefix__", index);
    document.getElementById("travelers").insertAdjacentHTML("beforeend", html);
    total.value = index + 1;
  });
</script>
